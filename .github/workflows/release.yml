name: Release to Maven Central

# Manual-only trigger by design: a human must deliberately run this (or push a
# release tag) — publishing must never happen as a side effect of an ordinary
# push to main. See docs/ROADMAP.md's "Publishing target" open question.
#
# Fully tag-driven versioning (see docs/ROADMAP.md's "Versioning" section):
# there is no committed "current release version" anywhere in this repo's
# pom.xml files to bump. A tag push derives the version straight from the tag
# name; a manual workflow_dispatch run has no tag to derive it from, so it
# must be supplied explicitly via the required "version" input instead —
# never guessed or defaulted.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version to publish (e.g. 1.2.3 or 1.2.3-rc.1). Required
          because a manual run has no git tag to derive it from.
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  # The Axon Framework release this toolkit's Axon-coupled modules
  # (integrations/eventstore-axon, bootstrap-axon-postgres,
  # opendcb-axon-spring-boot-starter, opendcb-axon-spring-boot-routing) are
  # built and qualified against — appended to opendcb-axon.version as
  # "-${AXON_VERSION_QUALIFIER}". Bumped manually and deliberately, only when
  # the project actually upgrades to a new Axon Framework release. NEVER
  # derived from the release tag/version input: opendcb.version and
  # opendcb-axon.version are two independent version lines (see
  # docs/ROADMAP.md's "Versioning" section) — a plain 1.2.3 release tag says
  # nothing about which Axon Framework version the Axon-coupled modules were
  # built against.
  AXON_VERSION_QUALIFIER: axon5.1

jobs:
  publish:
    name: Build, sign, and stage a release on Maven Central
    runs-on: ubuntu-latest
    # No contents:write override here (unlike an earlier version of this
    # file): once main is branch-protected, a plain GITHUB_TOKEN push is
    # rejected regardless of permissions — GitHub deliberately does not let
    # GITHUB_TOKEN bypass a protected branch, since that would let any
    # collaborator push anything by writing a workflow that does it. The
    # bump step below instead authenticates as the opendcb-release-bot
    # GitHub App (contents:read-and-write on this repo only, installed only
    # here), which IS on main's ruleset bypass list — see
    # docs/CONTRIBUTING.md's "Branch protection" section for the full
    # rationale and how this was verified before being applied to main.
    steps:
      - uses: actions/checkout@v7

      # Resolves the release version from whichever trigger fired this run,
      # then validates it before anything else runs — a malformed tag or a
      # typo'd manual input must fail loudly here, not silently produce a
      # broken/partial release several minutes into the build.
      #
      # The workflow_dispatch input is passed in via `env:` rather than
      # interpolated directly into the script body, per GitHub's own
      # script-injection guidance for untrusted `${{ }}` values in `run:`.
      - name: Resolve and validate release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Tag push, e.g. refs/tags/v1.2.3 -> GITHUB_REF_NAME=v1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Semver-ish: X.Y.Z, optionally with a -qualifier suffix
          # (e.g. 1.2.3, 1.2.3-rc.1). Anchored so a partial/garbage match
          # can't sneak through.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid release version — expected X.Y.Z or X.Y.Z-qualifier (e.g. 1.2.3 or 1.2.3-rc.1). Check the pushed tag or the workflow_dispatch 'version' input."
            exit 1
          fi

          AXON_VERSION="${VERSION}-${AXON_VERSION_QUALIFIER}"
          echo "opendcb_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "opendcb_axon_version=$AXON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing opendcb.version=$VERSION, opendcb-axon.version=$AXON_VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Confirm Docker is available (required for Testcontainers)
        run: docker version

      # crazy-max/ghaction-import-gpg: current, actively maintained action for
      # importing a GPG key into the runner's keyring. Also caches the
      # passphrase in gpg-agent, which maven-gpg-plugin's useAgent=true
      # (the plugin's default) can pick up directly. The private key and
      # passphrase are read from GitHub secrets by name only — their values
      # never appear in this file.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Writes only the literal placeholder text ${env.CENTRAL_USERNAME} /
      # ${env.CENTRAL_PASSWORD} to disk — Maven resolves these from the
      # environment at build time (see the mvn step below), so the actual
      # secret values are never written to a file or echoed to a log.
      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # -P release flips the root pom.xml's gpg.skip property to false (it
      # defaults to true so plain `mvn install` works on machines with no GPG
      # key, e.g. CI's own boundary-check/build jobs and every contributor's
      # laptop) — without this flag, artifacts would upload unsigned.
      #
      # -Dopendcb.version / -Dopendcb-axon.version override the pom.xml
      # properties' local-dev defaults with the values resolved and validated
      # above; flatten-maven-plugin (root pom.xml pluginManagement,
      # flattenMode=ossrh) bakes those resolved values into the flattened POM
      # actually deployed, so Maven Central never sees the unresolved
      # "${opendcb.version}" property reference.
      #
      # autoPublish is deliberately NOT set anywhere in this pipeline: the
      # central-publishing-maven-plugin uploads and validates a deployment
      # bundle, but a human must still sign in to central.sonatype.com and
      # click "Publish" after reviewing it. Central is immutable — a version
      # published there can never be removed or modified — so the first
      # (and every) release goes out as a deliberate, reviewed action, not an
      # automatic one. Switching to autoPublish=true is a decision to revisit
      # later, not an oversight — see docs/ROADMAP.md.
      - name: Build, test, sign, and stage the release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          mvn --batch-mode clean deploy -DskipTests=false -P release
          -Dopendcb.version=${{ steps.version.outputs.opendcb_version }}
          -Dopendcb-axon.version=${{ steps.version.outputs.opendcb_axon_version }}

      # Runs ONLY if the mvn deploy step above actually succeeded — `if:
      # success()` here is belt-and-suspenders on top of the Actions default
      # (a failed prior step already skips every later step with no `if:`
      # override), because a failed/partial publish must never leave main
      # looking like it shipped something it didn't.
      #
      # Deliberately checks out `main` FRESH here (via an explicit shallow
      # fetch + checkout -B), rather than editing pom.xml on whatever ref
      # this run started from: a tag-push trigger leaves the job on a
      # detached HEAD at the tag commit, which can already be behind main's
      # real tip by the time the release finishes. Bumping and pushing from
      # that stale ref would either fail as a non-fast-forward push or
      # (worse, if ever forced) silently roll main back. Fetching main's own
      # tip immediately before editing keeps this a plain fast-forward
      # commit no matter how main has moved since the tag was cut. Verified
      # this exact scenario (a commit landing on main after the tag, then
      # the bump step running from the tag's detached HEAD) against a
      # scratch repo before relying on it for a real release.
      #
      # sed, not xmlstarlet/any plugin — deliberately simple. The
      # `0,/regex/s//repl/` form is a GNU sed idiom (matches only the FIRST
      # occurrence in the file); this only ever runs on ubuntu-latest's real
      # GNU sed, verified directly in an ubuntu container rather than
      # assumed — the equivalent command silently no-ops on macOS/BSD sed,
      # which is exactly the kind of "looks fine, does nothing" failure this
      # step must not have. That first-match behavior is what lets the same
      # pattern target the root aggregator's own <version> element (line 24
      # today) without also rewriting the many other <version> tags further
      # down the file (BOM/plugin versions in dependencyManagement/
      # pluginManagement) — root has no <parent> block, so its own
      # <version> is always the first <version> element in the file. The
      # two <opendcb...version> properties are separately named elements
      # (not <version>), so they're matched by their own tag names instead
      # and can't collide with that first-match rule.
      # Mints a short-lived (~1hr) installation token for the
      # opendcb-release-bot GitHub App (contents:read-and-write, installed
      # only on this repo) — this, not GITHUB_TOKEN, is what's on main's
      # ruleset bypass list, since GitHub does not permit GITHUB_TOKEN
      # itself to bypass a protected branch under any permissions setting.
      # RELEASE_BOT_APP_ID / RELEASE_BOT_APP_PRIVATE_KEY are repo secrets;
      # the private key value never appears in this file or any log.
      - name: Mint an installation token for the release bot App
        if: success()
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: opendcb

      - name: Bump committed local-dev-default versions to match the release
        if: success()
        env:
          NEW_VERSION: ${{ steps.version.outputs.opendcb_version }}
          NEW_AXON_VERSION: ${{ steps.version.outputs.opendcb_axon_version }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          sed -i "0,/<version>[^<]*<\/version>/s//<version>${NEW_VERSION}<\/version>/" pom.xml
          sed -i "s/<opendcb.version>[^<]*<\/opendcb.version>/<opendcb.version>${NEW_VERSION}<\/opendcb.version>/" pom.xml
          sed -i "s/<opendcb-axon.version>[^<]*<\/opendcb-axon.version>/<opendcb-axon.version>${NEW_AXON_VERSION}<\/opendcb-axon.version>/" pom.xml

          if git diff --quiet -- pom.xml; then
            echo "pom.xml on main already reflects ${NEW_VERSION} — nothing to commit."
            exit 0
          fi

          # Commit author is the App's own bot identity (opendcb-release-bot[bot],
          # user id 318557238 — confirmed via `gh api users/opendcb-release-bot%5Bbot%5D`),
          # not the generic github-actions[bot] this step used before the App
          # existed. The push itself authenticates via the App's installation
          # token over HTTPS (not the checkout's default credentials), which is
          # what actually lets this land on a protected main — the git
          # author/committer fields below are just commit metadata and don't
          # affect push authorization.
          git config user.name "opendcb-release-bot[bot]"
          git config user.email "318557238+opendcb-release-bot[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Bump committed local-dev-default versions to ${NEW_VERSION} after release"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin main
